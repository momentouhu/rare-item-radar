name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 年齢・和暦などは基準年ベースで静的生成しているため、毎週日曜に再ビルドして鮮度を保つ
  schedule:
    - cron: '0 18 * * 0' # 毎週月曜 03:00 JST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # 独自ドメインに移行したら SITE_URL / BASE_PATH をリポジトリの Variables で上書きする
          SITE_URL: ${{ vars.SITE_URL || 'https://momentouhu.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/keisan-lab' }}
          PUBLIC_GA_ID: ${{ vars.GA_ID }}
          PUBLIC_ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          PUBLIC_ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
