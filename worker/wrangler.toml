name = "rare-item-radar"
main = "src/index.js"
compatibility_date = "2026-01-01"

# 1分ごとに起動し、Worker内部で監視対象の階層（realtime/fast/normal）を振り分ける
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "radar"
# `wrangler d1 create radar` で発行されたIDを入れる
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
# Secretsは `wrangler secret put NAME` かダッシュボードで設定する:
#   RAKUTEN_APP_ID / RAKUTEN_AFFILIATE_ID
#   DISCORD_WEBHOOK_URL
#   THREADS_USER_ID / THREADS_ACCESS_TOKEN
#   BLUESKY_IDENTIFIER / BLUESKY_APP_PASSWORD
